<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Dolphin-Mistral Live Debate Arena</title>
  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: rgba(14, 20, 34, 0.92);
      --senator-blue: #00d2ff;
      --senator-glow: rgba(0, 210, 255, 0.35);
      --congress-red: #ff3b69;
      --congress-glow: rgba(255, 59, 105, 0.35);
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #8899ac;
      --border-color: #1e293f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(255, 59, 105, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--senator-blue), #ffffff, var(--congress-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 2px;
    }

    /* Configuration Drawer */
    .config-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.75rem;
      max-width: 1100px;
      margin: 0 auto 0.75rem auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.6rem;
      backdrop-filter: blur(12px);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .form-group label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input, select {
      background: #0b101c;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--senator-blue);
    }

    /* Active Stage Spotlight */
    .stage-spotlight {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0.9rem;
      max-width: 1100px;
      margin: 0 auto 0.75rem auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: all 0.3s ease;
      position: relative;
    }

    .stage-spotlight.senator-turn {
      border-color: var(--senator-blue);
      box-shadow: 0 0 20px var(--senator-glow);
    }

    .stage-spotlight.congress-turn {
      border-color: var(--congress-red);
      box-shadow: 0 0 20px var(--congress-glow);
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .speaker-pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .speaker-pill.senator {
      background: rgba(0, 210, 255, 0.15);
      color: var(--senator-blue);
      border: 1px solid var(--senator-blue);
    }

    .speaker-pill.congress {
      background: rgba(255, 59, 105, 0.15);
      color: var(--congress-red);
      border: 1px solid var(--congress-red);
    }

    .live-status {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .active-quote-display {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #fff;
      min-height: 48px;
      font-weight: 500;
    }

    /* Unified Debate Feed */
    .feed-container {
      background: #080c14;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem;
      max-width: 1100px;
      margin: 0 auto 0.75rem auto;
      width: 100%;
      flex: 1;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .message-bubble {
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
      max-width: 90%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-bubble.senator {
      align-self: flex-start;
      background: rgba(0, 210, 255, 0.1);
      border-left: 3px solid var(--senator-blue);
    }

    .message-bubble.congress {
      align-self: flex-end;
      background: rgba(255, 59, 105, 0.1);
      border-right: 3px solid var(--congress-red);
    }

    .bubble-author {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .senator .bubble-author { color: var(--senator-blue); }
    .congress .bubble-author { color: var(--congress-red); }

    /* Footer & Mobile Action Controls */
    .controls-panel {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .intervention-bar {
      display: flex;
      gap: 0.4rem;
      background: var(--card-bg);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-start {
      background: linear-gradient(135deg, #00d2ff, #0077ff);
      color: #000;
      flex: 1;
      max-width: 200px;
    }

    .btn-stop {
      background: #ff3b69;
      color: #fff;
      flex: 1;
      max-width: 200px;
    }

    .btn-aux {
      background: #172134;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-stop:disabled, .btn-start:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pulsing-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.4; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Dolphin-Mistral Debate Arena</h1>
    <p>Mobile-Optimized Chamber &bull; Zero-Latency Pipelined Engine</p>
  </header>

  <!-- Settings Panel -->
  <section class="config-panel">
    <div class="form-group" style="grid-column: span 2;">
      <label for="debateTopic">Motion on the Floor</label>
      <input type="text" id="debateTopic" value="Artificial Intelligence must be granted full legal human rights." />
    </div>

    <!-- AI Connection Mode -->
    <div class="form-group">
      <label for="connectionType">AI Connection</label>
      <select id="connectionType" onchange="toggleConnectionUI()">
        <option value="tunnel" selected>Mac Dolphin-Mistral (Free Tunnel)</option>
        <option value="cloud">Cloud API (OpenRouter Free)</option>
        <option value="local">Direct Local (http://localhost)</option>
      </select>
    </div>

    <!-- Tunnel / Local Endpoint Input -->
    <div class="form-group" id="endpointGroup">
      <label for="customEndpoint">Ollama Endpoint URL</label>
      <input type="text" id="customEndpoint" value="http://localhost:11434/api/generate" placeholder="https://your-tunnel.loca.lt/api/generate" />
    </div>

    <!-- Cloud Options (Only shown in cloud mode) -->
    <div class="form-group cloud-opt" style="display: none;">
      <label for="cloudApiKey">OpenRouter API Key</label>
      <input type="password" id="cloudApiKey" placeholder="sk-or-v1-..." />
    </div>

    <div class="form-group cloud-opt" style="display: none;">
      <label for="cloudModel">Cloud Model</label>
      <select id="cloudModel">
        <option value="openrouter/free" selected>OpenRouter Free Router (Always $0)</option>
        <option value="mistralai/mistral-small-3.1-24b-instruct:free">Mistral Small 24B (Free)</option>
        <option value="meta-llama/llama-3.2-3b-instruct:free">Llama 3.2 3B (Fast &amp; Free)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="genreMode">Music Genre Delivery</label>
      <select id="genreMode">
        <option value="hiphop" selected>Hip-Hop (Rap Bars &amp; Rhymes)</option>
        <option value="classical">Classical (Mozart Opera)</option>
        <option value="pop">Pop (Catchy Hooks)</option>
        <option value="rock">Rock (Gritty Anthem)</option>
        <option value="jazz">Jazz (New Orleans Swing)</option>
        <option value="country">Country (Acoustic Folk)</option>
        <option value="edm">Electronic / EDM (Synthesizer Drop)</option>
        <option value="none">Parliamentary (Formal Speech)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="roundModeSelect">Rounds Mode</label>
      <select id="roundModeSelect">
        <option value="unlimited" selected>Unlimited (&infin;)</option>
        <option value="4">4 Rounds</option>
        <option value="6">6 Rounds</option>
        <option value="10">10 Rounds</option>
      </select>
    </div>
  </section>

  <!-- Live Speaker Spotlight (Replaces Duplicate App Look) -->
  <section class="stage-spotlight senator-turn" id="stagePodium">
    <div class="stage-header">
      <span class="speaker-pill senator" id="stagePill">The Senator (Pro)</span>
      <div class="live-status" id="stageStatus">
        <span class="pulsing-dot" style="background:#22c55e;"></span>
        <span id="stageStatusText">Ready for Motion</span>
      </div>
    </div>
    <div class="active-quote-display" id="stageLiveQuote">
      Tap "Begin Debate" or "Test Sound" to start the chamber.
    </div>
  </section>

  <!-- Unified Mobile Debate Feed -->
  <main class="feed-container" id="debateFeed">
    <div class="message-bubble senator">
      <div class="bubble-author">The Senator &bull; Affirmative</div>
      Chamber gavel ready. Awaiting order of the floor.
    </div>
  </main>

  <!-- Mobile Controls Panel -->
  <footer class="controls-panel">
    <div class="intervention-bar">
      <input type="text" id="interventionInput" placeholder="Audience intervention: inject an order..." />
      <button class="btn-aux" onclick="submitIntervention()">Inject</button>
    </div>

    <div class="button-group">
      <button class="btn-start" id="btnStart" onclick="startDebate()">Begin Debate</button>
      <button class="btn-stop" id="btnStop" onclick="stopDebate()" disabled>Stop</button>
      <button class="btn-aux" onclick="testMobileSound()">🔊 Test Sound</button>
    </div>
  </footer>

  <script>
    let isRunning = false;
    let currentRound = 1;
    let pendingIntervention = "";
    let debateTranscript = [];
    let systemVoices = [];
    let isAudioUnlocked = false;

    const GENRE_CONFIGS = {
      hiphop: {
        label: "Hip-Hop",
        rateMod: 1.08,
        instruction: "You are in a live rap battle. You NEVER speak in plain prose. You MUST write your response as exactly 4 rhyming lines of punchy battle rap. Every single line MUST rhyme (AABB or ABAB). Do not use formal titles like Senator or Congressperson.",
        callToAction: "Spit exactly 4 punchy rhyming battle rap bars now (pure lyrics, every line must rhyme):"
      },
      classical: {
        label: "Classical",
        rateMod: 0.94,
        instruction: "You are an opera singer in a classical opera by Mozart or Beethoven. You NEVER speak in plain prose. You MUST write your response as 4 grand, dramatic, rhyming operatic lines with sweeping classical meter.",
        callToAction: "Sing your 4-line classical operatic verse now (poetic classical rhymes):"
      },
      rock: {
        label: "Rock",
        rateMod: 1.05,
        instruction: "You are a raw, gritty rock frontman singing a high-energy rock anthem. You NEVER speak in plain prose. You MUST write your response as 4 lines of hard-hitting, rhyming rock lyrics with heavy attitude.",
        callToAction: "Sing your 4-line gritty rock anthem lyrics now (punchy rock rhymes):"
      },
      pop: {
        label: "Pop",
        rateMod: 1.06,
        instruction: "You are an upbeat pop star performing a chart-topping hit. You NEVER speak in plain prose. You MUST write your response as 4 catchy, bouncy, rhyming pop song lines with radio-friendly hooks.",
        callToAction: "Sing your 4-line upbeat pop song verse now (catchy rhymes):"
      },
      jazz: {
        label: "Jazz",
        rateMod: 0.96,
        instruction: "You are a cool New Orleans jazz singer. You NEVER speak in plain prose. You MUST write your response as 4 smooth, syncopated swing-jazz lines with scat phrasing ('yeah', 'dig it') and cool rhymes.",
        callToAction: "Sing your 4-line smooth swing-jazz verse now (scat phrasing, cool jazz rhymes):"
      },
      country: {
        label: "Country",
        rateMod: 0.95,
        instruction: "You are an acoustic country folk singer with a guitar. You NEVER speak in plain prose. You MUST write your response as 4 lines of heartfelt country storytelling song lyrics with down-home folk rhymes.",
        callToAction: "Sing your 4-line acoustic country storytelling verse now (down-home folk rhymes):"
      },
      edm: {
        label: "EDM",
        rateMod: 1.12,
        instruction: "You are an electronic festival vocalist hyping the crowd. You NEVER speak in plain prose. You MUST write your response as 4 rapid-fire, synthesizer-pulsed staccato chant lines building up to an explosive drop.",
        callToAction: "Chant your 4-line synthesizer-pulsed EDM festival drop lyrics now:"
      },
      none: {
        label: "Parliamentary",
        rateMod: 1.0,
        instruction: "You are a sharp debater. Avoid repeating titles like 'Senator' or 'Congressperson' every sentence. Speak naturally and sharply. Keep your rebuttal strictly under 3 sentences.",
        callToAction: "Deliver your direct debate rebuttal now (under 3 punchy sentences):"
      }
    };

    function toggleConnectionUI() {
      const mode = document.getElementById("connectionType").value;
      const isCloud = mode === "cloud";
      document.querySelectorAll(".cloud-opt").forEach(el => el.style.display = isCloud ? "flex" : "none");
      document.getElementById("endpointGroup").style.display = isCloud ? "none" : "flex";
    }

    // Save OpenRouter API Key
    const keyInput = document.getElementById("cloudApiKey");
    const savedKey = localStorage.getItem("debateArena_openrouter_key");
    if (savedKey) keyInput.value = savedKey;
    keyInput.addEventListener("input", (e) => {
      localStorage.setItem("debateArena_openrouter_key", e.target.value.trim());
    });

    // Voice Discovery
    const synth = window.speechSynthesis;
    function loadVoices() {
      if (!synth) return;
      systemVoices = synth.getVoices().filter(v => v.lang.startsWith("en"));
      if (!systemVoices.length) systemVoices = synth.getVoices();
    }
    if (synth) {
      loadVoices();
      if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    }

    // --- Critical Mobile Audio Unlock Function ---
    // Runs synchronously inside the user's touch event so iOS Safari never blocks speech!
    function unlockMobileAudio() {
      if (!synth) return;
      if (synth.paused) synth.resume();
      
      // Zero-volume micro-vocalization unlocks the audio token permanently
      const blank = new SpeechSynthesisUtterance(" ");
      blank.volume = 0.01;
      blank.rate = 10;
      synth.speak(blank);
      isAudioUnlocked = true;
    }

    function testMobileSound() {
      unlockMobileAudio();
      const test = new SpeechSynthesisUtterance("The sound system is active. Check your phone's silent switch if muted.");
      if (systemVoices.length) test.voice = systemVoices[0];
      test.rate = 1.0;
      synth.speak(test);
    }

    function cleanModelOutput(raw) {
      if (!raw) return "";
      let text = raw.trim();
      text = text.replace(/^\[.*?\]\s*/i, "").replace(/^\(.*?\)\s*/i, "");
      text = text.replace(/^(the\s+)?(senator|congressperson|representative|debater\s+[ab])\s*:\s*/i, "");
      text = text.replace(/\*/g, "");
      text = text.replace(/^["'“‘]+/, "").replace(/["'”’]+$/, "");
      return text.trim();
    }

    function speakText(text, isSenator) {
      return new Promise((resolve) => {
        if (!synth) { setTimeout(resolve, 600); return; }
        if (synth.paused) synth.resume();

        const utterance = new SpeechSynthesisUtterance(text);

        // Pick distinct voices for Senator vs Congressperson
        if (systemVoices.length > 1) {
          utterance.voice = isSenator ? systemVoices[0] : systemVoices[1];
        } else if (systemVoices.length === 1) {
          utterance.voice = systemVoices[0];
        }

        const genreKey = document.getElementById("genreMode").value;
        const genreMod = (GENRE_CONFIGS[genreKey] || GENRE_CONFIGS.none).rateMod || 1.0;

        utterance.pitch = isSenator ? 1.05 : 0.95;
        utterance.rate = 1.0 * genreMod;

        let hasResolved = false;
        const done = () => {
          if (!hasResolved) {
            hasResolved = true;
            resolve();
          }
        };

        utterance.onend = done;
        utterance.onerror = done;

        // Watchdog prevents mobile lockup
        const wordCount = text.split(/\s+/).length;
        const maxAllowed = Math.max(3000, (wordCount / 100) * 60 * 1000 + 3500);
        setTimeout(() => { if (!hasResolved) done(); }, maxAllowed);

        synth.speak(utterance);
      });
    }

    // --- AI Query: Free Mac Tunnel, Local, or Cloud ---
    async function queryAI(speakerTitle, isSenator, opponentSpokenText = null) {
      const connMode = document.getElementById("connectionType").value;
      const topic = document.getElementById("debateTopic").value.trim();
      const genreKey = document.getElementById("genreMode").value;
      const genre = GENRE_CONFIGS[genreKey] || GENRE_CONFIGS.none;

      const stance = isSenator ? "IN FAVOR of the motion" : "AGAINST the motion";

      let prompt = 
        `You are The ${isSenator ? 'Senator' : 'Congressperson'}.\n` +
        `YOUR STANCE: Argue ${stance}.\n` +
        `MOTION: "${topic}"\n\n` +
        `STYLE: ${genre.instruction}\n\n`;

      if (opponentSpokenText) {
        prompt += `THE OPPONENT IS CURRENTLY ARGUING:\n"${opponentSpokenText}"\n\n`;
        prompt += `Directly counter what they are saying in your ${genre.label} style.\n`;
      } else if (debateTranscript.length > 0) {
        const lastEntry = debateTranscript[debateTranscript.length - 1];
        prompt += `THE OPPONENT JUST SAID:\n"${lastEntry.text}"\n\n`;
        prompt += `Directly counter what they just said in your ${genre.label} style.\n`;
      } else {
        prompt += `OPENING ROUND: Kick off the debate on this topic in your ${genre.label} style.\n`;
      }

      if (pendingIntervention) {
        prompt += `[CHAMBER INTERVENTION]: "${pendingIntervention}"\nIncorporate or counter this!\n`;
        pendingIntervention = "";
      }

      prompt += `\n${genre.callToAction}`;

      // 1. CLOUD OPENROUTER FREE PATH
      if (connMode === "cloud") {
        const apiKey = document.getElementById("cloudApiKey").value.trim();
        const model = document.getElementById("cloudModel").value;

        if (!apiKey) {
          alert("Please enter a free OpenRouter API key in settings or use Mac Tunnel!");
          throw new Error("Missing OpenRouter key");
        }

        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`,
            "HTTP-Referer": window.location.href,
            "X-Title": "Dolphin-Mistral Debate Arena"
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: "system", content: genre.instruction },
              { role: "user", content: prompt }
            ],
            temperature: 0.88
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `Cloud Error ${res.status}`);
        }

        const data = await res.json();
        return cleanModelOutput(data.choices[0].message.content);
      }

      // 2. MAC TUNNEL / LOCAL OLLAMA PATH (Direct Dolphin-Mistral)
      let endpoint = document.getElementById("customEndpoint").value.trim();
      if (!endpoint.endsWith("/api/generate")) {
        endpoint = endpoint.replace(/\/+$/, "") + "/api/generate";
      }

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Bypass-Tunnel-Reminder": "true" // Needed for localtunnel
        },
        body: JSON.stringify({
          model: "dolphin-mistral",
          prompt: prompt,
          stream: false,
          options: { temperature: 0.88 }
        })
      });

      if (!res.ok) throw new Error(`Ollama HTTP Error ${res.status}`);

      const data = await res.json();
      return cleanModelOutput(data.response);
    }

    // --- Pipelined Execution Loop ---
    async function startDebate() {
      if (isRunning) return;

      // Unlocks mobile audio immediately on user click
      unlockMobileAudio();

      isRunning = true;
      currentRound = 1;
      debateTranscript = [];
      document.getElementById("debateFeed").innerHTML = "";

      document.getElementById("btnStart").disabled = true;
      document.getElementById("btnStop").disabled = false;
      document.getElementById("debateTopic").disabled = true;

      const roundMode = document.getElementById("roundModeSelect").value;
      const isUnlimited = roundMode === "unlimited";
      const maxRounds = isUnlimited ? Infinity : parseInt(roundMode);

      try {
        updateStageUI("The Senator", true, "thinking", "Composing Opening...");
        let currentText = await queryAI("The Senator", true);
        if (!isRunning) return;

        addMessageToFeed("The Senator", true, currentText);

        let currentSpeaker = "The Senator";
        let isSenator = true;

        while (isRunning && (isUnlimited || currentRound <= maxRounds)) {
          const nextSpeaker = isSenator ? "The Congressperson" : "The Senator";
          const nextIsSenator = !isSenator;

          // 1. Kick off opponent's pre-thinking in background
          const prefetchPromise = queryAI(nextSpeaker, nextIsSenator, currentText);

          // 2. Spotlight & Speak current text
          updateStageUI(currentSpeaker, isSenator, "speaking", currentText);
          await speakText(currentText, isSenator);

          while (synth && synth.speaking) {
            await new Promise(r => setTimeout(r, 60));
          }

          if (!isRunning) break;

          // 3. Await preloaded opponent response (zero downtime)
          updateStageUI(nextSpeaker, nextIsSenator, "thinking", "Delivering Counter-Punch...");
          const nextText = await prefetchPromise;
          if (!isRunning) break;

          await new Promise(r => setTimeout(r, 150));

          addMessageToFeed(nextSpeaker, nextIsSenator, nextText);

          currentText = nextText;
          currentSpeaker = nextSpeaker;
          isSenator = nextIsSenator;

          if (isSenator) currentRound++;
        }
      } catch (e) {
        console.error(e);
        alert(`Debate Error: ${e.message}`);
      } finally {
        stopDebate();
      }
    }

    function updateStageUI(speakerTitle, isSenator, state, quoteText) {
      const stage = document.getElementById("stagePodium");
      const pill = document.getElementById("stagePill");
      const statusText = document.getElementById("stageStatusText");
      const quote = document.getElementById("stageLiveQuote");

      stage.className = `stage-spotlight ${isSenator ? 'senator-turn' : 'congress-turn'}`;
      pill.className = `speaker-pill ${isSenator ? 'senator' : 'congress'}`;
      pill.innerText = speakerTitle;

      if (state === "speaking") {
        statusText.innerHTML = `<span class="pulsing-dot" style="background:#22c55e;"></span> Speaking Live`;
        quote.innerText = `"${quoteText}"`;
      } else {
        statusText.innerHTML = `<span class="pulsing-dot" style="background:#f59e0b;"></span> Pre-Thinking`;
        quote.innerText = `Preparing argument against the floor...`;
      }
    }

    function addMessageToFeed(speaker, isSenator, text) {
      const feed = document.getElementById("debateFeed");
      const bubble = document.createElement("div");
      bubble.className = `message-bubble ${isSenator ? 'senator' : 'congress'}`;
      bubble.innerHTML = `<div class="bubble-author">${speaker}</div>${text}`;
      feed.appendChild(bubble);
      feed.scrollTop = feed.scrollHeight;

      debateTranscript.push({ speaker, text, round: currentRound });
    }

    function stopDebate() {
      isRunning = false;
      if (synth) synth.cancel();

      document.getElementById("btnStart").disabled = false;
      document.getElementById("btnStop").disabled = true;
      document.getElementById("debateTopic").disabled = false;

      const statusText = document.getElementById("stageStatusText");
      statusText.innerText = "Chamber Adjourned";
    }

    function submitIntervention() {
      const input = document.getElementById("interventionInput");
      const val = input.value.trim();
      if (!val) return;
      pendingIntervention = val;
      input.value = "";
      alert(`Intervention queued: "${val}"`);
    }
  </script>
</body>
</html>
