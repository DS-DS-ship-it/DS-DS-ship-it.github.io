<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
               viewport-fit=cover">
<meta name="generator" content="ALLX 1.0.0">
<meta name="description"
      content="Generated by ALLX">
<title>ALLX Video Studio</title>
<style>

        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #070b12;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .app {
            width: min(1100px, 100%);
            margin: auto;
            padding: 32px;
        }

        .panel {
            background: #111827;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 80px rgba(0,0,0,.45);
        }

        .video {
            width: 100%;
            display: block;
            border-radius: 18px;
            background: #000;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 18px;
            background: #ffffff;
            color: #111827;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .counter {
            margin-top: 18px;
            font-size: 22px;
            font-weight: 800;
        }
</style>
</head>
<body>
<div class="app">
<div class="panel">
<h1>
ALLX Video Studio
</h1>
<p>
A .allx source file compiled into portable HTML5.
</p>
<video id="demo" class="video" controls playsinline preload="metadata">
<source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
</video>
<div class="controls">
<button id="play">
Play
</button>
<button id="pause">
Pause
</button>
<button id="restart">
Restart
</button>
<button id="fullscreen">
Fullscreen
</button>
<button id="countButton">
<span data-allx-text="countButton">{{label}}: {{count}}</span>
</button>
</div>
<p id="status" class="counter">
ALLX is running.
</p>
</div>
</div>
<script>

(function () {
    "use strict";

    window.ALLX = window.ALLX || {};

    const A = window.ALLX;

    A.q = function (selector) {
        return document.querySelector(selector);
    };

    A.qa = function (selector) {
        return Array.from(document.querySelectorAll(selector));
    };

    A.text = function (selector, value) {
        const el = A.q(selector);
        if (el) el.textContent = value;
    };

    A.html = function (selector, value) {
        const el = A.q(selector);
        if (el) el.innerHTML = value;
    };

    A.show = function (selector) {
        const el = A.q(selector);
        if (el) el.hidden = false;
    };

    A.hide = function (selector) {
        const el = A.q(selector);
        if (el) el.hidden = true;
    };

    A.toggle = function (selector) {
        const el = A.q(selector);
        if (el) el.hidden = !el.hidden;
    };

    A.fullscreen = async function (selector) {
        const el = A.q(selector) || document.documentElement;

        if (el.requestFullscreen) {
            try {
                await el.requestFullscreen();
            } catch (e) {
                console.warn("ALLX fullscreen:", e);
            }
        }
    };

    A.video = {

        get: function (selector) {
            return A.q(selector);
        },

        play: function (selector) {
            const v = A.q(selector);

            if (!v) return;

            const promise = v.play();

            if (promise && promise.catch) {
                promise.catch(function (err) {
                    console.warn("ALLX video play:", err);
                });
            }
        },

        pause: function (selector) {
            const v = A.q(selector);

            if (v) {
                v.pause();
            }
        },

        toggle: function (selector) {
            const v = A.q(selector);

            if (!v) return;

            if (v.paused) {
                A.video.play(selector);
            } else {
                v.pause();
            }
        },

        restart: function (selector) {
            const v = A.q(selector);

            if (!v) return;

            v.currentTime = 0;
            A.video.play(selector);
        },

        seek: function (selector, seconds) {
            const v = A.q(selector);

            if (v) {
                v.currentTime = Number(seconds) || 0;
            }
        },

        volume: function (selector, value) {
            const v = A.q(selector);

            if (v) {
                v.volume = Math.max(
                    0,
                    Math.min(1, Number(value))
                );
            }
        },

        mute: function (selector, state) {
            const v = A.q(selector);

            if (v) {
                v.muted = Boolean(state);
            }
        },

        speed: function (selector, value) {
            const v = A.q(selector);

            if (v) {
                v.playbackRate = Number(value) || 1;
            }
        }
    };

    A.bind = function (selector, event, callback) {
        const el = A.q(selector);

        if (el) {
            el.addEventListener(event, callback);
        }
    };

    A.on = function (event, callback) {
        window.addEventListener(event, callback);
    };

    A.emit = function (event, detail) {
        window.dispatchEvent(
            new CustomEvent(event, {
                detail: detail
            })
        );
    };

    A.ready = function (callback) {
        if (document.readyState === "loading") {
            document.addEventListener(
                "DOMContentLoaded",
                callback,
                { once: true }
            );
        } else {
            callback();
        }
    };

})();

let count = 0;
let label = "Plays";

ALLX.ready(function () {
    const __allx_el = document.getElementById("play");

    if (__allx_el) {
        __allx_el.addEventListener(
            "click",
            function () {
                ALLX.video.play("#demo");
            }
        );
    }
});


ALLX.ready(function () {
    const __allx_el = document.getElementById("pause");

    if (__allx_el) {
        __allx_el.addEventListener(
            "click",
            function () {
                ALLX.video.pause("#demo");
            }
        );
    }
});


ALLX.ready(function () {
    const __allx_el = document.getElementById("restart");

    if (__allx_el) {
        __allx_el.addEventListener(
            "click",
            function () {
                ALLX.video.restart("#demo");
            }
        );
    }
});


ALLX.ready(function () {
    const __allx_el = document.getElementById("fullscreen");

    if (__allx_el) {
        __allx_el.addEventListener(
            "click",
            function () {
                ALLX.fullscreen("#demo");
            }
        );
    }
});


ALLX.ready(function () {
    const __allx_el = document.getElementById("countButton");

    if (__allx_el) {
        __allx_el.addEventListener(
            "click",
            function () {
                count = count + 1;
ALLX.text("#countButton", `${label}: ${count}`);
            }
        );
    }
});

</script>
</body>
</html>
