<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALLX Video Studio & Aurora Engine</title>
<style>
:root {
    --bg-main: #070b12;
    --panel-bg: #111827;
    --accent: #ff7ab6;
    --accent-glow: #b46cff;
    --aurora-cyan: #00f2fe;
    --aurora-purple: #4facfe;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: radial-gradient(circle at center, #131c2e, var(--bg-main));
    color: #f3f4f6;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
}
.app-container {
    width: min(960px, 100%);
    background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
}
.title-group h1 {
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.title-group p {
    font-size: 0.85rem;
    color: #9ca3af;
    margin-top: 4px;
}
.badge {
    background: rgba(79, 172, 254, 0.15);
    border: 1px solid rgba(0, 242, 254, 0.4);
    color: var(--aurora-cyan);
    font-size: 0.75rem;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.player-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed rgba(255,255,255,0.15);
    transition: border-color 0.2s ease;
}
.player-viewport.dragover {
    border-color: var(--aurora-cyan);
    background: rgba(0, 242, 254, 0.05);
}
video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.aurora-filter {
    filter: contrast(1.15) saturate(1.25) hue-rotate(10deg);
}
.drop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(11, 15, 25, 0.85);
    color: #9ca3af;
    pointer-events: none;
    transition: opacity 0.2s ease;
}
.drop-overlay.hidden { opacity: 0; }
.controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-top: 18px;
}
button, .file-btn {
    background: #1f2937;
    color: #f3f4f6;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
button:hover, .file-btn:hover {
    background: #374151;
    border-color: rgba(255,255,255,0.25);
    color: #fff;
}
.btn-primary {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-color: #3b82f6;
}
.btn-primary:hover {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
}
.btn-aurora {
    background: linear-gradient(135deg, #059669, #10b981);
    border-color: #34d399;
}
.btn-aurora.active {
    background: linear-gradient(135deg, #9333ea, #c026d3);
    border-color: #e879f9;
}
.stream-bar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}
.stream-input {
    flex: 1;
    background: #0b0f19;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    color: #f3f4f6;
    font-size: 0.85rem;
    outline: none;
}
.stream-input:focus {
    border-color: var(--aurora-cyan);
}
.diagnostics-panel {
    margin-top: 20px;
    background: #0b0f19;
    border-radius: 12px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    font-size: 0.8rem;
}
.diag-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.diag-label { color: #6b7280; text-transform: uppercase; font-size: 0.7rem; }
.diag-value { color: #e5e7eb; font-family: ui-monospace, SFMono-Regular, monospace; }
input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="title-group">
            <h1>ALLX Video Studio</h1>
            <p>Portable HTML5 Media Runner & Aurora Precision Integration</p>
        </div>
        <span class="badge" id="engineBadge">ALLX Engine Active</span>
    </div>

    <div class="player-viewport" id="dropZone">
        <video id="videoElement" controls playsinline></video>
        <div class="drop-overlay" id="dropOverlay">
            <p>Drop Video / .ALLX File Here</p>
            <span style="font-size:0.75rem; margin-top:6px;">or click Choose File below</span>
        </div>
    </div>

    <div class="stream-bar">
        <input type="text" class="stream-input" id="streamUrlInput" placeholder="Paste direct video URL (.mp4, .webm, stream link)...">
        <button class="btn-primary" id="loadUrlBtn">Load & Play</button>
    </div>

    <div class="controls-bar">
        <label class="file-btn">
            Choose Local File
            <input type="file" id="fileInput" accept="video/*,.allx,.json,.txt">
        </label>
        <button id="playPauseBtn">Play / Pause</button>
        <button id="restartBtn">Restart</button>
        <button id="fullscreenBtn">Fullscreen</button>
        <button class="btn-aurora" id="auroraModeBtn">Aurora Q1024 Mode: OFF</button>
        <button id="counterBtn">Interactions: 0</button>
    </div>

    <div class="diagnostics-panel">
        <div class="diag-item">
            <span class="diag-label">Pipeline Architecture</span>
            <span class="diag-value">ALLX Spatial 1.0</span>
        </div>
        <div class="diag-item">
            <span class="diag-label">Color Depth & Precision</span>
            <span class="diag-value" id="precisionVal">Standard 8-bit sRGB</span>
        </div>
        <div class="diag-item">
            <span class="diag-label">Active Source</span>
            <span class="diag-value" id="sourceVal">Flower Demo Loop</span>
        </div>
        <div class="diag-item">
            <span class="diag-label">Aurora Quantum Mode</span>
            <span class="diag-value" id="auroraStatusVal">Standby</span>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('videoElement');
const dropZone = document.getElementById('dropZone');
const dropOverlay = document.getElementById('dropOverlay');
const fileInput = document.getElementById('fileInput');
const streamInput = document.getElementById('streamUrlInput');
const loadUrlBtn = document.getElementById('loadUrlBtn');
const playPauseBtn = document.getElementById('playPauseBtn');
const restartBtn = document.getElementById('restartBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const auroraModeBtn = document.getElementById('auroraModeBtn');
const counterBtn = document.getElementById('counterBtn');
const precisionVal = document.getElementById('precisionVal');
const sourceVal = document.getElementById('sourceVal');
const auroraStatusVal = document.getElementById('auroraStatusVal');

let clicks = 0;
let auroraActive = false;

// Default demo video
video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
video.load();

function handleFile(file) {
    if (!file) return;
    dropOverlay.classList.add('hidden');
    if (file.name.endsWith('.allx') || file.name.endsWith('.json')) {
        const reader = new FileReader();
        reader.onload = (e) => {
            alert('Loaded ALLX Blueprint: ' + file.name + '\nSize: ' + file.size + ' bytes');
            sourceVal.textContent = file.name;
        };
        reader.readAsText(file);
    } else {
        const url = URL.createObjectURL(file);
        video.src = url;
        video.play();
        sourceVal.textContent = file.name;
    }
}

fileInput.addEventListener('change', (e) => {
    handleFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
    }
});

loadUrlBtn.addEventListener('click', () => {
    const url = streamInput.value.trim();
    if (url) {
        video.src = url;
        video.play();
        dropOverlay.classList.add('hidden');
        sourceVal.textContent = 'Stream: ' + url.substring(0, 30) + '...';
    }
});

playPauseBtn.addEventListener('click', () => {
    if (video.paused) { video.play(); } else { video.pause(); }
});

restartBtn.addEventListener('click', () => {
    video.currentTime = 0;
    video.play();
});

fullscreenBtn.addEventListener('click', () => {
    if (video.requestFullscreen) { video.requestFullscreen(); }
});

auroraModeBtn.addEventListener('click', () => {
    auroraActive = !auroraActive;
    if (auroraActive) {
        video.classList.add('aurora-filter');
        auroraModeBtn.textContent = 'Aurora Q1024 Mode: ON';
        auroraModeBtn.classList.add('active');
        precisionVal.textContent = 'Q1024 High-Precision (Lockstep UV)';
        auroraStatusVal.textContent = 'Quantum Filter Active';
    } else {
        video.classList.remove('aurora-filter');
        auroraModeBtn.textContent = 'Aurora Q1024 Mode: OFF';
        auroraModeBtn.classList.remove('active');
        precisionVal.textContent = 'Standard 8-bit sRGB';
        auroraStatusVal.textContent = 'Standby';
    }
});

counterBtn.addEventListener('click', () => {
    clicks++;
    counterBtn.textContent = 'Interactions: ' + clicks;
});
</script>
</body>
</html>
