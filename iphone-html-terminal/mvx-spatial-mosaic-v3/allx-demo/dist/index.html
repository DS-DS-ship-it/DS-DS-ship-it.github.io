.all-card{background:#111827;border:1px solid #243244;radius:24px;padding:32px;shadow:0 20px 60px rgba(0,0,0,.35)}</style></head><body><div class="all-root"><div><header><h1>ALL — Universal Markup</h1><p>Write one .all file. Compile to ordinary browser files.</p></header><section class="all-card"><h2>Hello <span id="all-1" data-all-bind="name"></span></h2><p><span id="all-2" data-all-bind="message"></span></p><p>Interactions: <span id="all-3" data-all-bind="count"></span></p><div class="all-row"><button id="all-4">Increment</button><button id="all-5">Reset</button></div></section><video src="sample.mp4" controls poster="" pay-per-minute="0.005 USD" track-object="jacket" timestamps="00:12-00:45" class="all-video" data-all-pay-per-minute="0.005 USD" data-all-track-object="jacket" data-all-timestamps="00:12-00:45"></video></div><div class="all-card"><h2>Reusable component</h2><p>Components are compiler-expanded.</p></div></div><script>(function(){
"use strict";

 let v=m[2].trim();if(v==="true"||v==="false")state[m[1]]=v==="true";else if(v==="event.value"&&event?.target)state[m[1]]=event.target.value;else if(/^".*"$/.test(v)||/^'.*'$/.test(v))state[m[1]]=v.slice(1,-1);else if(!Number.isNaN(Number(v)))state[m[1]]=Number(v);else return;render();
