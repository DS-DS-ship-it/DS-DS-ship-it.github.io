    for (let x = 0; x <= W; x += 40) {
      const h = Math.sin((x + this.camera.x * 0.1) * 0.012) * 55 + 110;
      ctx.lineTo(x, H - h);
    }
    ctx.lineTo(W, H); ctx.fill();
  },

  drawTiles() {
    const minTX = Math.max(0, Math.floor(this.camera.x / TILE));
    const maxTX = Math.min(this.world.w - 1, Math.ceil((this.camera.x + W) / TILE));
    const minTY = Math.max(0, Math.floor(this.camera.y / TILE));
    const maxTY = Math.min(this.world.h - 1, Math.ceil((this.camera.y + H) / TILE));

    for (let ty = minTY; ty <= maxTY; ty++) {
      for (let tx = minTX; tx <= maxTX; tx++) {
        const t = this.world.get(tx, ty);
        if (t === T_AIR) continue;
        const rx = tx * TILE - this.camera.x, ry = ty * TILE - this.camera.y;

        if (t === T_DIRT || t === T_BRICK) {
          ctx.fillStyle = (t === T_DIRT) ? '#3e4a5b' : '#283140';
          ctx.fillRect(rx, ry, TILE, TILE);
          if (!this.world.isSolid(tx, ty - 1)) {
            ctx.fillStyle = '#00ffcc'; ctx.fillRect(rx, ry, TILE, 2);
          }
          if (!this.world.isSolid(tx, ty + 1)) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillRect(rx, ry + TILE - 2, TILE, 2);
          }
        } else if (t === T_STEEL) {
          ctx.fillStyle = '#1c2635'; ctx.fillRect(rx, ry, TILE, TILE);
          ctx.strokeStyle = '#2d3e54'; ctx.strokeRect(rx, ry, TILE, TILE);
        } else if (t === T_PLATFORM) {
          ctx.fillStyle = '#00aaff'; ctx.fillRect(rx, ry, TILE, 4);
        } else if (t === T_LADDER) {
          ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2;
          ctx.strokeRect(rx + 3, ry, TILE - 6, TILE);
          ctx.beginPath();
          ctx.moveTo(rx + 3, ry + 6); ctx.lineTo(rx + TILE - 3, ry + 6);
          ctx.moveTo(rx + 3, ry + 12); ctx.lineTo(rx + TILE - 3, ry + 12);
          ctx.stroke();
        } else if (t === T_BARREL) {
          ctx.fillStyle = '#ff2200'; ctx.fillRect(rx + 2, ry + 2, TILE - 4, TILE - 2);
          ctx.fillStyle = '#ffdd00'; ctx.fillRect(rx + 5, ry + 6, TILE - 10, 4);
        } else if (t === T_ACID) {
          ctx.fillStyle = 'rgba(0, 255, 100, 0.75)'; ctx.fillRect(rx, ry + 4, TILE, TILE - 4);
        } else if (t === T_POD) {
          ctx.fillStyle = 'rgba(0, 255, 204, 0.4)'; ctx.fillRect(rx + 2, ry, TILE - 4, TILE);
          ctx.strokeStyle = '#00ffcc'; ctx.strokeRect(rx + 2, ry, TILE - 4, TILE);
        } else if (t === T_CRATE) {
          ctx.fillStyle = '#cc8800'; ctx.fillRect(rx + 2, ry + 2, TILE - 4, TILE - 2);
          ctx.strokeStyle = '#ffcc00'; ctx.strokeRect(rx + 2, ry + 2, TILE - 4, TILE - 2);
        }
      }
    }
  },

  drawExtractionAirlock() {
    if (this.level === 3) return;
    const ez = this.world.exitZone;
    const rx = ez.x - this.camera.x, ry = ez.y - this.camera.y;

    ctx.save();
    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3;
    ctx.strokeRect(rx, ry, ez.w, ez.h);

    const grad = ctx.createLinearGradient(rx, ry, rx + ez.w, ry + ez.h);
    grad.addColorStop(0, 'rgba(0, 255, 204, 0.2)');
    grad.addColorStop(0.5, 'rgba(0, 255, 204, 0.7)');
    grad.addColorStop(1, 'rgba(0, 255, 204, 0.2)');
    ctx.fillStyle = grad;
    ctx.fillRect(rx, ry, ez.w, ez.h);

    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#ffdd00';
    ctx.fillText('QUANTUM EXTRACTION GATEWAY', rx - 35, ry - 10);

    const p = this.player;
    if (Math.hypot((ez.x + ez.w/2) - (p.x + p.w/2), (ez.y + ez.h/2) - (p.y + p.h/2)) < 80) {
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('[E] OR WALK THROUGH TO WARP', rx - 20, ry - 24);
    }
    ctx.restore();
  },

  drawHUD() {
    // Health Bar
    ctx.fillStyle = 'rgba(10, 20, 30, 0.85)';
    ctx.fillRect(16, 16, 204, 18);
    const hpPct = Math.max(0, this.player.hp / this.player.maxHp);
    ctx.fillStyle = hpPct > 0.3 ? '#00ffcc' : '#ff2200';
    ctx.fillRect(18, 18, 200 * hpPct, 14);
    ctx.strokeStyle = '#00ffcc'; ctx.strokeRect(16, 16, 204, 18);
    ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(`HP: ${Math.round(this.player.hp)} / ${this.player.maxHp}`, 24, 30);

    // Persistent Menu Button
    ctx.fillStyle = 'rgba(14, 28, 48, 0.85)';
    ctx.fillRect(230, 16, 95, 20);
    ctx.strokeStyle = '#00ffcc'; ctx.strokeRect(230, 16, 95, 20);
    ctx.font = 'bold 10px monospace'; ctx.fillStyle = '#00ffcc';
    ctx.fillText('⏸ MENU [ESC]', 236, 30);

    // Weapon & Ammo
    const wep = WEAPONS[this.player.weaponIndex];
    ctx.fillStyle = 'rgba(10, 20, 30, 0.85)';
    ctx.fillRect(16, 40, 204, 22);
    ctx.fillStyle = wep.color; ctx.fillText(`WEAPON: ${wep.name}`, 22, 55);
    ctx.fillStyle = '#ffdd44'; ctx.fillText(`AMMO: ${wep.ammo === Infinity ? 'INF' : wep.ammo}`, 150, 55);

    // Grenades & Offline Series Score
    ctx.fillStyle = '#00ffcc';
    ctx.fillText(`GRENADES: ${this.player.grenades}`, 22, 78);
    ctx.fillStyle = '#ffaa00';
    ctx.fillText(`SERIES SCORE: P[ ${this.championship.playerWins} ] - [ ${this.championship.rivalWins} ] R`, 22, 94);

    // Squad Roster
    this.squad.forEach((sq, i) => {
      ctx.fillStyle = 'rgba(10, 20, 30, 0.75)';
      ctx.fillRect(16 + i * 92, H - 36, 84, 24);
      ctx.strokeStyle = sq.downed ? '#ff2200' : '#00ffcc';
      ctx.strokeRect(16 + i * 92, H - 36, 84, 24);
      ctx.fillStyle = sq.downed ? '#ff2200' : '#fff';
      ctx.fillText(sq.downed ? 'REVIVE!' : `HUGGER-${i+1}`, 22 + i * 92, H - 20);
    });

    // WAYPOINT COMPASS
    if (this.level < 3) {
      const ez = this.world.exitZone;
      const distM = Math.round(Math.hypot((ez.x + ez.w/2) - this.player.x, (ez.y + ez.h/2) - this.player.y) / 18);
      ctx.fillStyle = 'rgba(6, 16, 28, 0.85)';
      ctx.fillRect(W/2 - 110, 16, 220, 22);
      ctx.strokeStyle = '#ffdd00'; ctx.strokeRect(W/2 - 110, 16, 220, 22);
      ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`>>> AIRLOCK: ${distM}m >>>`, W/2, 31);
      ctx.textAlign = 'left';
    }

    // TACTICAL RADAR (Fog of War)
    const rw = 140, rh = 46;
    const rx = W - rw - 16, ry = 16;
    ctx.fillStyle = 'rgba(3, 8, 16, 0.85)';
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeStyle = '#00aaff'; ctx.strokeRect(rx, ry, rw, rh);

    ctx.drawImage(radarCanvas, rx, ry, rw, rh);

    const sx = rw / (this.world.w * TILE), sy = rh / (this.world.h * TILE);
    ctx.fillStyle = '#00ffcc'; ctx.fillRect(rx + this.player.x * sx - 1, ry + this.player.y * sy - 1, 3, 3);
    ctx.fillStyle = '#00ff00';
    this.squad.forEach(sq => ctx.fillRect(rx + sq.x * sx - 1, ry + sq.y * sy - 1, 2, 2));
    ctx.fillStyle = '#ff2200';
    this.enemies.forEach(e => {
      const tx = Math.floor(e.x / TILE), ty = Math.floor(e.y / TILE);
      if (this.world.explored[tx + ty * this.world.w]) {
        ctx.fillRect(rx + e.x * sx - 1, ry + e.y * sy - 1, 2, 2);
      }
    });

    let exploredCount = 0;
    for (let i = 0; i < this.world.explored.length; i++) if (this.world.explored[i]) exploredCount++;
    const exploredPct = Math.round((exploredCount / this.world.explored.length) * 100);
    ctx.font = '9px monospace'; ctx.fillStyle = '#88bbdd';
    ctx.fillText(`MAPPED: ${exploredPct}%`, rx + 4, ry + rh + 12);

    // Boss Bar
    if (this.boss) {
      ctx.fillStyle = 'rgba(20, 5, 5, 0.85)';
      ctx.fillRect(W/2 - 150, 16, 300, 16);
      ctx.fillStyle = '#ff1133';
      ctx.fillRect(W/2 - 148, 18, 296 * (this.boss.hp / this.boss.maxHp), 12);
      ctx.strokeStyle = '#ff3344'; ctx.strokeRect(W/2 - 150, 16, 300, 16);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText('TITAN BEHEMOTH CORE', W/2, 28);
      ctx.textAlign = 'left';
    }
  },

  drawPauseMenu() {
    ctx.fillStyle = 'rgba(2, 6, 14, 0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 15;
    ctx.fillText('TACTICAL SYSTEMS PAUSED', W/2, H/2 - 90);

    ctx.font = '14px monospace';
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
    ctx.fillText('[ESC / P] RESUME MISSION', W/2, H/2 - 40);
    ctx.fillText('[R] RESTART CURRENT SECTOR', W/2, H/2 - 10);

    ctx.fillStyle = '#ffdd44';
    ctx.fillText('[M] RETURN TO MAIN MENU', W/2, H/2 + 30);

    ctx.font = '12px monospace';
    ctx.fillStyle = '#88bbdd';
    ctx.fillText(`SFX: ${AudioEngine.sfxEnabled ? 'ON' : 'OFF'}  |  MUSIC: ${AudioEngine.musicEnabled ? 'ON' : 'OFF'}`, W/2, H/2 + 75);

    ctx.textAlign = 'left';
  },

  drawTitleScreen() {
    ctx.fillStyle = '#03060c';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 15;
    ctx.fillText('VOID BREACH: OFFLINE PROTOCOL', W/2, H/2 - 90);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#ffdd44'; ctx.shadowBlur = 0;
    ctx.fillText('FEATURING: ONLINE CHAMPION HYPER CLASH', W/2, H/2 - 50);

    const btnW = 340, btnH = 34;
    const drawBtn = (text, y, active) => {
      ctx.fillStyle = active ? 'rgba(0, 255, 204, 0.2)' : 'rgba(14, 28, 48, 0.85)';
      ctx.fillRect(W/2 - btnW/2, y, btnW, btnH);
      ctx.strokeStyle = active ? '#00ffcc' : '#0088cc';
      ctx.lineWidth = 2;
      ctx.strokeRect(W/2 - btnW/2, y, btnW, btnH);
      ctx.fillStyle = active ? '#00ffcc' : '#fff';
      ctx.font = 'bold 13px monospace';
      ctx.fillText(text, W/2, y + 22);
    };

    drawBtn('[1] CAMPAIGN MODE (BREACH SECTORS)', H/2, true);
    drawBtn('[2] ARENA DUEL (ONLINE CHAMPION)', H/2 + 45, false);

    ctx.font = '11px monospace';
    ctx.fillStyle = '#88bbdd';
    ctx.fillText('WASD: Move & Jump | MOUSE / F / J: Aim & Fire | SHIFT: Parry/Roll | E: Enter Airlock', W/2, H/2 + 130);
    ctx.fillText('CLICK AN OPTION OR PRESS [1] / [2] TO COMMENCE', W/2, H/2 + 160);

    if (Input.keys['Digit1'] || Input.keys['Space']) this.startNewGame();
    if (Input.keys['Digit2']) this.startDirectArena();

    if (Input.mouse.down) {
      Input.mouse.down = false;
      const my = Input.mouse.y;
      if (my >= H/2 && my <= H/2 + btnH) this.startNewGame();
      else if (my >= H/2 + 45 && my <= H/2 + 45 + btnH) this.startDirectArena();
    }

    ctx.textAlign = 'left';
  },

  drawGameOver() {
    ctx.fillStyle = 'rgba(20, 0, 5, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px monospace';
    ctx.fillStyle = '#ff2200';
    ctx.fillText('SIGNAL TERMINATED — CLONE SQUAD LOST', W/2, H/2 - 40);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PRESS [R] TO REDEPLOY SQUAD', W/2, H/2 + 10);
    ctx.fillStyle = '#ffdd44';
    ctx.fillText('PRESS [M] TO RETURN TO MAIN MENU', W/2, H/2 + 40);

    if (Input.keys['KeyM']) this.returnToMainMenu();
    ctx.textAlign = 'left';
  },

  drawVictory() {
    ctx.fillStyle = 'rgba(3, 16, 24, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = '#00ffcc';
    ctx.fillText('TITAN CORE OBLITERATED — MISSION COMPLETE', W/2, H/2 - 50);

    ctx.font = '15px monospace';
    ctx.fillStyle = '#ffdd44';
    ctx.fillText(`SCORE: ${this.score}  |  SURVIVING HUGGERS: ${this.squad.length + 1}  |  TIME: ${Math.round(this.timeElapsed)}s`, W/2, H/2 - 10);
    ctx.fillStyle = '#00ffaa';
    ctx.fillText(`HYPER CLASH CHAMPIONSHIP: PLAYER [ ${this.championship.playerWins} ] — [ ${this.championship.rivalWins} ] RIVALS`, W/2, H/2 + 20);

    ctx.font = '14px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PRESS [R] TO RESTART CAMPAIGN', W/2, H/2 + 60);
    ctx.fillStyle = '#ffdd44';
    ctx.fillText('PRESS [M] TO RETURN TO MAIN MENU', W/2, H/2 + 90);

    if (Input.keys['KeyM']) this.returnToMainMenu();
    ctx.textAlign = 'left';
  }
};

window.onload = () => Game.init();
</script>
