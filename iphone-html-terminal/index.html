<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MVX Mobile Code Terminal</title>
<style>
:root{
  --bg:#05070d;--panel:#101827;--panel2:#17243b;--text:#f7fbff;
  --muted:#9fb0c8;--blue:#2f7dff;--green:#11a765;--gold:#bd8100;
  --red:#b52d42;--border:rgba(255,255,255,.13);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17233a,#05070d 55%);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 14px;background:rgba(8,13,24,.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
h1{font-size:23px;margin:0}
small{color:var(--muted)}
main{padding:12px;max-width:1100px;margin:auto}
.panel{background:rgba(16,24,39,.96);border:1px solid var(--border);border-radius:18px;padding:13px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select{font-size:15px;border-radius:13px;border:1px solid var(--border);padding:10px 12px}
button{background:var(--blue);color:white;font-weight:800}
button.good{background:var(--green)}button.warn{background:var(--gold)}button.bad{background:var(--red)}
button.secondary{background:#263653}
input,select{background:#070b13;color:white}
textarea{width:100%;min-height:420px;background:#05070d;color:#dfffe7;border:1px solid var(--border);
border-radius:16px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.38}
pre{white-space:pre-wrap;background:#05070d;color:#dce8ff;border:1px solid var(--border);border-radius:16px;padding:12px;min-height:150px;overflow:auto}
iframe{width:100%;height:450px;background:white;border:1px solid var(--border);border-radius:16px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#22314f;color:#cfe0ff;margin:2px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>MVX Mobile Code Terminal</h1>
<small>iPhone web-code workstation • editor • preview • diagnostics • downloader • project memory</small>
</header>

<main>
<section class="panel">
<div class="row">
<button onclick="runCommand('help')">Help</button>
<button onclick="runCommand('new html')">New HTML</button>
<button onclick="runCommand('inspect')">Inspect Code</button>
<button onclick="runCommand('preview')">Preview</button>
<button onclick="runCommand('save')" class="good">Save</button>
<button onclick="runCommand('load')" class="secondary">Load</button>
<button onclick="runCommand('download')" class="good">Download</button>
<button onclick="runCommand('copy')" class="warn">Copy</button>
<button onclick="runCommand('clear log')" class="bad">Clear Log</button>
</div>
</section>

<section class="panel">
<b>Terminal Command Line</b>
<div class="row" style="margin-top:8px">
<input id="cmd" style="flex:1" placeholder="Try: help, new html, inspect, preview, save, download">
<button onclick="runTyped()">Run</button>
</div>
<div style="margin-top:8px">
<span class="badge">help</span><span class="badge">new html</span><span class="badge">inspect</span>
<span class="badge">preview</span><span class="badge">save</span><span class="badge">load</span>
<span class="badge">download</span><span class="badge">copy</span>
</div>
</section>

<div class="grid">
<section class="panel">
<b>Code Editor</b>
<textarea id="editor" spellcheck="false"></textarea>
</section>
<section class="panel">
<b>Live Preview</b>
<iframe id="preview"></iframe>
</section>
</div>

<section class="panel">
<b>Terminal Output / Troubleshooting</b>
<pre id="log">MVX Mobile Code Terminal ready. Type help.</pre>
</section>
</main>

<script>
const editor=document.getElementById("editor");
const logBox=document.getElementById("log");
const preview=document.getElementById("preview");
const cmdInput=document.getElementById("cmd");

const starter=[
"<!doctype html>",
"<html lang='en'>",
"<head>",
"<meta charset='utf-8'>",
"<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>",
"<title>My iPhone Web App</title>",
"<style>",
"body{margin:0;background:#05070d;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}",
"main{padding:16px}",
"button{font-size:18px;padding:12px;border-radius:14px;border:0;background:#2f7dff;color:white}",
"</style>",
"</head>",
"<body>",
"<main>",
"<h1>My iPhone Web App</h1>",
"<button onclick='alert(\"Working\")'>Test Button</button>",
"</main>",
"</body>",
"</html>"
].join("\\n");

function log(t){logBox.textContent=t}
function add(t){logBox.textContent+="\\n"+t}
function runTyped(){runCommand(cmdInput.value.trim().toLowerCase())}

function runCommand(c){
 if(!c){log("No command entered.");return}
 if(c==="help"){
  log("COMMANDS\\n"+
  "help — show commands\\n"+
  "new html — create a clean starter app\\n"+
  "inspect — diagnose HTML/CSS/JS problems\\n"+
  "preview — run editor code in preview window\\n"+
  "save — save editor code to browser storage\\n"+
  "load — load saved code\\n"+
  "download — download editor code as index.html\\n"+
  "copy — copy code to clipboard\\n"+
  "clear log — clear output\\n\\n"+
  "This is a safe browser terminal. It cannot run real Unix shell commands, but it can build, inspect, preview, save, and export web apps directly from iPhone.");
 }
 else if(c==="new html"){
  editor.value=starter;
  log("Created clean starter HTML.");
 }
 else if(c==="inspect"){
  inspectCode();
 }
 else if(c==="preview"){
  preview.srcdoc=editor.value;
  log("Preview updated.");
 }
 else if(c==="save"){
  localStorage.setItem("mvx_terminal_code",editor.value);
  log("Saved current code to browser storage.");
 }
 else if(c==="load"){
  editor.value=localStorage.getItem("mvx_terminal_code")||starter;
  log("Loaded saved code.");
 }
 else if(c==="download"){
  const blob=new Blob([editor.value],{type:"text/html"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="index.html";
  a.click();
  log("Downloaded index.html.");
 }
 else if(c==="copy"){
  navigator.clipboard.writeText(editor.value).then(()=>log("Copied code."),()=>log("Copy failed. Select manually."));
 }
 else if(c==="clear log"){
  log("");
 }
 else{
  log("Unknown command: "+c+"\\nType help.");
 }
}

function inspectCode(){
 const s=editor.value;
 let good=[],bad=[],warn=[];
 const count=(x)=>((s.match(new RegExp(x,"g"))||[]).length);

 if(!s.trim())bad.push("Editor is empty.");
 if(/<!doctype html/i.test(s))good.push("DOCTYPE found."); else warn.push("Missing <!doctype html>.");
 if(/<html/i.test(s))good.push("HTML tag found."); else bad.push("Missing <html>.");
 if(/<head/i.test(s))good.push("Head section found."); else warn.push("Missing <head>.");
 if(/<body/i.test(s))good.push("Body section found."); else warn.push("Missing <body>.");
 if(/viewport/i.test(s))good.push("Mobile viewport found."); else warn.push("Missing mobile viewport meta tag.");
 if(count("<script")===count("<\\/script>"))good.push("Script tags balanced."); else bad.push("Script tag mismatch.");
 if(count("<style")===count("<\\/style>"))good.push("Style tags balanced."); else bad.push("Style tag mismatch.");
 if(/canvas/i.test(s))good.push("Canvas detected.");
 if(/type=['\"]file['\"]/i.test(s))good.push("File/photo input detected.");
 if(/capture=['\"]environment['\"]/i.test(s))good.push("Rear camera capture hint detected.");
 if(/getUserMedia/i.test(s))warn.push("Live camera preview may need HTTPS and may not use full iPhone Camera quality.");
 if(/toDataURL|Blob|download/i.test(s))good.push("Export/download logic detected.");

 let out="MVX DIAGNOSTIC REPORT\\n---------------------\\n";
 if(good.length)out+="\\nGOOD\\n"+good.map(x=>"✅ "+x).join("\\n")+"\\n";
 if(warn.length)out+="\\nWARNINGS\\n"+warn.map(x=>"⚠️ "+x).join("\\n")+"\\n";
 if(bad.length)out+="\\nERRORS\\n"+bad.map(x=>"❌ "+x).join("\\n")+"\\n";
 if(!bad.length)out+="\\nNo fatal problems found. Press Preview.";
 log(out);
}

editor.value=localStorage.getItem("mvx_terminal_code")||starter;
runCommand("help");
</script>
</body>
</html>
