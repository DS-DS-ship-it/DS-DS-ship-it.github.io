<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commercial In Progress — TV0 Spatial Mosaic</title>
  <style>
    :root {
      --bg-dark: #05070d;
      --accent-green: #00f076;
      --accent-glow: rgba(0, 240, 118, 0.45);
      --accent-blue: #0088ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text-main);
      font-family: var(--font-stack);
      display: flex;
      flex-direction: column;
    }

    /* ========================================================
       CINEMATIC VIDEO COMMERCIAL STAGE (AUTOPLAYS INSTANTLY)
       ======================================================== */
    #theater-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #commercialVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Top Overlay: Ad Status & Unmute Button */
    .top-ad-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .ad-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: blinkDot 1.4s infinite;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .audio-btn {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      pointer-events: auto;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Bottom Overlay: Sponsor Attribution & Skip Action Button */
    .bottom-ad-bar {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
    }

    .sponsor-card {
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 20px;
      border-radius: 14px;
      backdrop-filter: blur(14px);
      max-width: 360px;
    }

    .sponsor-card h4 {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sponsor-card p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .visit-sponsor-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--accent-green);
      text-decoration: none;
      font-weight: 700;
    }

    .visit-sponsor-link:hover {
      text-decoration: underline;
    }

    /* The Main Skip Button */
    .skip-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .btn-skip {
      background: rgba(15, 22, 38, 0.9);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 1rem;
      cursor: not-allowed;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn-skip.unlocked {
      background: linear-gradient(135deg, var(--accent-green), #00c853);
      color: #03140a;
      border-color: var(--accent-green);
      cursor: pointer;
      box-shadow: 0 0 30px var(--accent-glow);
      animation: pulseGreen 1.8s infinite;
    }

    @keyframes pulseGreen {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Video Progress Line at Bottom Edge */
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 20;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      transition: width 1s linear;
    }
  </style>
</head>
<body>

  <div id="theater-wrap">

    <!-- 
      THE COMMERCIAL VIDEO (Autoplays immediately on load)
      Plays inline and muted so Safari / iOS never block it
    -->
    <video 
      id="commercialVideo" 
      src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" 
      autoplay 
      muted 
      playsinline 
      loop
    ></video>

    <!-- Top Overlay -->
    <div class="top-ad-bar">
      <div class="ad-pill">
        <div class="pulse-dot"></div>
        <span>SPONSORED COMMERCIAL (AD 1 OF 1)</span>
      </div>

      <button id="audioToggle" class="audio-btn" onclick="toggleAudio()">
        🔊 Tap for Sound
      </button>
    </div>

    <!-- Bottom Overlay -->
    <div class="bottom-ad-bar">
      
      <!-- Sponsor Card -->
      <div class="sponsor-card">
        <h4>⚡ Adsterra Verified Sponsor</h4>
        <p>This session supports the development of TV0 Spatial Mosaic.</p>
        <a 
          href="https://www.profitableratecpmnetwork.com/f0mvh66h1?key=473d6c4019bb37302ba67c76fb9894ac" 
          target="_blank" 
          class="visit-sponsor-link"
        >
          Explore Current Sponsor Campaign ↗
        </a>
      </div>

      <!-- Action Skip Button -->
      <div class="skip-btn-wrap">
        <button id="skipActionBtn" class="btn-skip" onclick="skipAdAndLaunchTV()">
          ⏳ Skip Ad in <span id="countdownSecs">5</span>s
        </button>
      </div>

    </div>

    <!-- Live Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

  <script>
    // HARDCODED DESTINATIONS
    const TARGET_TV_APP = "https://ds-ds-ship-it.github.io/iphone-html-terminal/mvx-spatial-mosaic-v3/TV0.html";
    const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/f0mvh66h1?key=473d6c4019bb37302ba67c76fb9894ac";

    const TOTAL_SECONDS = 5;
    let secondsRemaining = TOTAL_SECONDS;
    let timerInterval = null;

    window.addEventListener("DOMContentLoaded", () => {
      startCommercialExperience();
    });

    /* ========================================================
       AUTO-PLAY COMMERCIAL & 5-SECOND COUNTDOWN
       ======================================================== */
    function startCommercialExperience() {
      const video = document.getElementById("commercialVideo");
      const btn = document.getElementById("skipActionBtn");
      const countdownEl = document.getElementById("countdownSecs");
      const progressFill = document.getElementById("progressFill");

      // Ensure video starts playing immediately
      video.play().catch(() => {
        video.muted = true;
        video.play();
      });

      timerInterval = setInterval(() => {
        secondsRemaining--;

        if (countdownEl) countdownEl.textContent = secondsRemaining;

        // Update progress bar
        const pct = Math.round(((TOTAL_SECONDS - secondsRemaining) / TOTAL_SECONDS) * 100);
        if (progressFill) progressFill.style.width = pct + "%";

        // When the 5-second payout duration completes
        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);

          // Unlock the Skip Button
          btn.classList.add("unlocked");
          btn.innerHTML = "👉 SKIP AD & OPEN TV APP ➔";
        }
      }, 1000);
    }

    /* ========================================================
       AUDIO TOGGLE (Safari compliant)
       ======================================================== */
    function toggleAudio() {
      const video = document.getElementById("commercialVideo");
      const audioBtn = document.getElementById("audioToggle");

      if (video.muted) {
        video.muted = false;
        audioBtn.textContent = "🔇 Mute";
      } else {
        video.muted = true;
        audioBtn.textContent = "🔊 Tap for Sound";
      }
    }

    /* ========================================================
       DUAL ACTION: REGISTERS ADSTERRA PAYOUT & OPENS TV0.HTML
       ======================================================== */
    function skipAdAndLaunchTV() {
      if (secondsRemaining > 0) return; // Still locked during countdown

      // 1. Open the Adsterra direct link in a new tab (registers impression and credits account)
      try {
        window.open(ADSTERRA_DIRECT_LINK, "_blank");
      } catch (err) {
        console.warn("Popup notice:", err);
      }

      // 2. Immediately navigate this window to TV0.html
      setTimeout(() => {
        window.location.replace(TARGET_TV_APP);
      }, 300);

      // 3. Fallback: Force location update if browser stalls
      setTimeout(() => {
        window.location.href = TARGET_TV_APP;
      }, 1200);
    }
  </script>
</body>
</html>
