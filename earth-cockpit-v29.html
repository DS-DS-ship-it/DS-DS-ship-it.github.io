<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Earth Cockpit v29 Clean Fixed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://unpkg.com/cesium@1.119.0/Build/Cesium/Widgets/widgets.css">
  <script src="https://unpkg.com/cesium@1.119.0/Build/Cesium/Cesium.js"></script>

  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>

  <style>
    :root{
      color-scheme:dark;
      --bg:#07111a;
      --panel:#0d1723;
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.16);
      --text:#edf6ff;
      --muted:#95b5d6;
      --ok:#4ade80;
      --warn:#fbbf24;
      --bad:#f87171;
      --shadow:0 18px 48px rgba(0,0,0,.42);
      --safeTop:env(safe-area-inset-top,0px);
      --safeBottom:env(safe-area-inset-bottom,0px);
      --panelW:420px;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      background:var(--bg);color:var(--text);
      font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }
    body{touch-action:manipulation}
    #app{width:100%;height:100%;display:grid;grid-template-columns:var(--panelW) 1fr;background:var(--bg)}
    #panel{
      overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
      touch-action:pan-y pinch-zoom;
      background:linear-gradient(180deg, rgba(13,23,35,.985), rgba(7,13,20,.995));
      border-right:1px solid var(--line);padding:10px;z-index:9000;
      transition:transform .24s ease, opacity .24s ease, visibility .24s ease;
    }
    #stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
    #map2d,#map3d,#astroWrap{position:absolute;inset:0;width:100%;height:100%;background:#000}
    #map3d,#astroWrap{display:none}
    #astroCanvas{position:absolute;inset:0;width:100%;height:100%;background:#000}
    .box{
      background:rgba(255,255,255,.03);border:1px solid var(--line);
      border-radius:var(--radius);padding:10px;margin-bottom:10px;box-shadow:var(--shadow);
    }
    .title{margin:0 0 6px;font-size:16px;font-weight:900}
    .sub{margin:0 0 8px;color:var(--muted);font-size:12px}
    .tiny{color:var(--muted);font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
    .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
    .row:last-child{margin-bottom:0}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    button,select,input[type="text"],input[type="date"]{
      width:100%;background:#0c1622;color:var(--text);border:1px solid var(--line2);
      border-radius:10px;padding:8px 9px;font:inherit;outline:none
    }
    input[type="text"],select{-webkit-appearance:none;appearance:none;font-size:16px}
    button{cursor:pointer}
    button.primary{background:#173a5d;border-color:#78b9ff}
    button.active{background:#173a5d;border-color:#78b9ff}
    label.check{display:flex;gap:7px;align-items:center;margin-bottom:6px;user-select:none}
    label.check input{width:auto;margin:0}
    .badge{
      display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;
      border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-size:12px
    }
    .badge.ok{color:#dfffea;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.12)}
    .badge.warn{color:#fff4d4;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.12)}
    .badge.bad{color:#ffe1e1;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.12)}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center;margin-bottom:6px}
    .tinyout{
      padding:8px 9px;border:1px solid var(--line);border-radius:10px;
      background:rgba(255,255,255,.03);color:var(--text);min-height:34px;display:flex;align-items:center
    }
    #hud,#perf,#astroHUD{
      position:absolute;z-index:9999;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);
      background:rgba(8,14,22,.78);backdrop-filter:blur(10px);pointer-events:none;box-shadow:var(--shadow)
    }
    #hud{top:10px;right:10px;max-width:420px}
    #perf{left:10px;bottom:10px;min-width:220px}
    #astroHUD{right:10px;bottom:10px;min-width:260px;max-width:420px;white-space:pre-wrap}
    .menu-toggle{
      position:fixed;top:calc(12px + var(--safeTop));left:12px;z-index:12000;font-size:20px;
      background:rgba(10,12,18,.92);border:1px solid rgba(255,255,255,.16);color:white;
      padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow);display:none
    }
    #panelBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:11000;display:none}
    #astroMiniHud{position:absolute;right:10px;bottom:70px;z-index:10001;display:flex;gap:6px;flex-wrap:wrap}
    #astroMiniHud button{width:auto;min-width:64px;background:rgba(10,14,22,.84)}
    .leaflet-container{background:#070b10}
    @media (max-width:980px){
      #app{display:block}
      #panel{
        position:fixed;left:10px;top:calc(10px + var(--safeTop));bottom:calc(10px + var(--safeBottom));
        width:min(395px, calc(100vw - 20px));max-width:calc(100vw - 20px);
        border:1px solid var(--line);border-radius:16px;z-index:11500;
        max-height:calc(100dvh - var(--safeTop) - var(--safeBottom) - 20px)
      }
      #panel.panel-hidden{transform:translateX(calc(-100% - 16px));opacity:0;visibility:hidden;pointer-events:none}
      .menu-toggle{display:block}
      #panelBackdrop.show{display:block}
      #hud{max-width:min(80vw, 360px)}
      #astroHUD{left:10px;right:auto;max-width:min(86vw,360px);bottom:calc(10px + var(--safeBottom))}
    }
  </style>
</head>
<body>
  <button id="menuToggle" class="menu-toggle">☰</button>
  <div id="panelBackdrop"></div>

  <div id="app">
    <aside id="panel">
      <div class="box">
        <div class="title">Earth Cockpit v29 Clean Fixed</div>
        <div class="sub">Working 2D + 3D + Astro + Astro route builder</div>
        <div class="grid3">
          <button id="mode2d" class="primary active">2D</button>
          <button id="mode3d">3D</button>
          <button id="modeAstro">ASTRO</button>
        </div>
        <div class="row" style="margin-top:6px;">
          <span id="modeBadge" class="badge">Mode: 2D</span>
          <span id="statusBadge" class="badge warn">Booting</span>
        </div>
      </div>

      <div class="box">
        <div class="tiny">Search Earth or sky</div>
        <div class="row">
          <input id="searchBox" type="text" placeholder="Orlando, 28.54,-81.38, M31, Vega">
        </div>
        <div class="grid2">
          <button id="searchBtn" class="primary">Go</button>
          <button id="homeBtn">Home</button>
        </div>
      </div>

      <div class="box">
        <div class="tiny"><b>Base layer</b></div>
        <div class="row">
          <select id="baseSelect">
            <option value="esri">Esri World Imagery</option>
            <option value="osm">OpenStreetMap</option>
            <option value="hot">OSM Humanitarian</option>
            <option value="gibs_modis">NASA GIBS MODIS True Color</option>
            <option value="gibs_viirs">NASA GIBS VIIRS True Color</option>
          </select>
        </div>
        <div class="tiny">NASA date</div>
        <div class="row"><input id="gibsDate" type="date"></div>
        <label class="check"><input id="labelsChk" type="checkbox" checked> Labels / place names</label>
      </div>

      <div class="box">
        <div class="tiny"><b>Astronomy / travel route</b></div>
        <div class="tiny">Start node</div>
        <div class="row"><select id="spaceStartSelect"></select></div>
        <div class="tiny">Target node</div>
        <div class="row"><select id="spaceEndSelect"></select></div>
        <div class="grid3">
          <button id="spaceBuildBtn" class="primary">Build route</button>
          <button id="spaceClearBtn">Clear</button>
          <button id="spaceCenterEarthBtn">Earth</button>
        </div>
        <div class="row" style="margin-top:6px;">
          <select id="spaceDistanceUnitSelect">
            <option value="ly">Distances in ly</option>
            <option value="au">Distances in AU</option>
            <option value="km">Distances in km</option>
          </select>
        </div>
        <div class="kv"><div class="tiny">Total route</div><div id="spaceDistanceOut" class="tinyout">—</div></div>
        <div class="kv"><div class="tiny">Leg count</div><div id="spaceLegCountOut" class="tinyout">—</div></div>
        <div class="kv"><div class="tiny">Bearing</div><div id="spaceBearingOut" class="tinyout">—</div></div>
        <div class="kv"><div class="tiny">SVC</div><div id="spaceSvcOut" class="tinyout">—</div></div>
      </div>

      <div class="box">
        <div class="tiny"><b>Aladin sky</b></div>
        <div class="row">
          <select id="astroSurvey">
            <option value="P/DSS2/color">DSS2 color</option>
            <option value="P/2MASS/color">2MASS infrared</option>
            <option value="P/allWISE/color">AllWISE infrared</option>
            <option value="P/GALEXGR6/AIS/color">GALEX ultraviolet</option>
            <option value="P/IRIS/color">IRIS infrared</option>
            <option value="P/Planck/color">Planck</option>
            <option value="P/RASS">ROSAT X-ray</option>
          </select>
        </div>
        <div class="row">
          <input id="astroSearchBox" type="text" placeholder="M31, Vega, NGC 1300">
        </div>
        <div class="grid3">
          <button id="astroSearchBtn" class="primary">Find</button>
          <button id="astroResetBtn">Reset sky</button>
          <button id="astroReticleBtn">Reticle</button>
        </div>
        <div class="grid3" style="margin-top:6px;">
          <button id="astroZoomInBtn">Sky +</button>
          <button id="astroZoomOutBtn">Sky −</button>
          <button id="astroFitBtn">Wide</button>
        </div>
      </div>

      <div class="box">
        <div class="tiny"><b>Diagnostics</b></div>
        <div id="log" class="mono tiny" style="max-height:260px;overflow:auto;"></div>
      </div>
    </aside>

    <main id="stage">
      <div id="map2d"></div>
      <div id="map3d"></div>

      <div id="astroWrap">
        <div id="astroCanvas"></div>
        <div id="astroMiniHud">
          <button id="astroHudMinus">−</button>
          <button id="astroHudPlus">+</button>
          <button id="astroHudWide">Wide</button>
        </div>
      </div>

      <div id="hud" class="mono tiny">Booting…</div>
      <div id="perf" class="mono tiny">fps: —</div>
      <div id="astroHUD" class="mono tiny">Space route idle</div>
    </main>
  </div>

<script>
(() => {
  "use strict";

  Cesium.Ion.defaultAccessToken = undefined;

  const SPACE_CATALOG = [
    { id:"earth", name:"Earth", ra:0, dec:0, distanceLy:0 },
    { id:"moon", name:"Moon", ra:15, dec:2, distanceLy:0.0000000406 },
    { id:"sun", name:"Sun", ra:0, dec:0, distanceLy:0.0000158125 },
    { id:"mars", name:"Mars", ra:80, dec:8, distanceLy:0.000024 },
    { id:"jupiter", name:"Jupiter", ra:120, dec:-4, distanceLy:0.000082 },
    { id:"alpha_centauri", name:"Alpha Centauri", ra:219.9021, dec:-60.8339, distanceLy:4.37 },
    { id:"proxima", name:"Proxima Centauri", ra:217.4292, dec:-62.6795, distanceLy:4.2465 },
    { id:"sirius", name:"Sirius", ra:101.2875, dec:-16.7161, distanceLy:8.6 },
    { id:"vega", name:"Vega", ra:279.2347, dec:38.7837, distanceLy:25.04 },
    { id:"polaris", name:"Polaris", ra:37.9546, dec:89.2641, distanceLy:433 },
    { id:"m31", name:"M31 Andromeda Galaxy", ra:10.6847, dec:41.2687, distanceLy:2537000 },
    { id:"m42", name:"M42 Orion Nebula", ra:83.8221, dec:-5.3911, distanceLy:1344 },
    { id:"m45", name:"M45 Pleiades", ra:56.75, dec:24.1167, distanceLy:444 }
  ];

  const CONFIG = {
    home: { lat: 28.538336, lon: -81.379234, zoom2d: 5, height3d: 18000000 },
    esri: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    osm: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    hot: "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
    labels: "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png",
    nominatim: "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
  };

  const $ = id => document.getElementById(id);

  const state = {
    mode: "2d",
    map2d: null,
    viewer3d: null,
    base2dLayer: null,
    labels2dLayer: null,
    labels3dLayer: null,
    astro: {
      instance: null,
      routeCatalog: null,
      routeOverlay: null,
      survey: "P/DSS2/color",
      target: "M31",
      fov: 120,
      reticle: true
    ,
      earthRoute2d: null,
      earthRoute2dMarkers: null,
      earthRoute3d: null,
}
  };

  function log(msg){
    const line = "[" + new Date().toLocaleTimeString() + "] " + msg;
    console.log(line);
    const el = $("log");
    if (el) {
      el.textContent += line + "\\n";
      el.scrollTop = el.scrollHeight;
    }
  }

  function fmt(n, d=4){
    return Number.isFinite(n) ? Number(n).toFixed(d) : "—";
  }

  function setStatus(text, kind=""){
    const el = $("statusBadge");
    if (!el) return;
    el.textContent = text;
    el.className = `badge ${kind}`.trim();
  }

  function updateModeBadge(){
    $("modeBadge").textContent = `Mode: ${state.mode.toUpperCase()}`;
    $("mode2d").classList.toggle("active", state.mode === "2d");
    $("mode3d").classList.toggle("active", state.mode === "3d");
    $("modeAstro").classList.toggle("active", state.mode === "astro");
  }

  function yesterdayUTC(){
    const d = new Date();
    d.setUTCDate(d.getUTCDate() - 1);
    return d.toISOString().slice(0,10);
  }

  function gibsBaseUrl(id){
    const date = $("gibsDate").value || yesterdayUTC();
    return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${id}/default/${date}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`;
  }

  function buildBaseLayer(key){
    if (key === "osm") {
      return L.tileLayer(CONFIG.osm, { subdomains:"abc", maxZoom:19, attribution:"OSM" });
    }
    if (key === "hot") {
      return L.tileLayer(CONFIG.hot, { subdomains:"abc", maxZoom:19, attribution:"OSM HOT" });
    }
    if (key === "gibs_modis") {
      return L.tileLayer(gibsBaseUrl("MODIS_Terra_CorrectedReflectance_TrueColor"), { maxZoom:19, maxNativeZoom:9, attribution:"NASA GIBS" });
    }
    if (key === "gibs_viirs") {
      return L.tileLayer(gibsBaseUrl("VIIRS_SNPP_CorrectedReflectance_TrueColor"), { maxZoom:19, maxNativeZoom:9, attribution:"NASA GIBS" });
    }
    return L.tileLayer(CONFIG.esri, { maxZoom:19, attribution:"Esri" });
  }

  function init2D(){
    if (state.map2d) return;
    state.map2d = L.map("map2d", {
      center:[CONFIG.home.lat, CONFIG.home.lon],
      zoom:CONFIG.home.zoom2d,
      worldCopyJump:true,
      zoomControl:true,
      preferCanvas:true
    });

    state.map2d.createPane("labels");
    state.map2d.getPane("labels").style.zIndex = 650;

    state.labels2dLayer = L.tileLayer(CONFIG.labels, {
      pane:"labels",
      subdomains:"abcd",
      maxZoom:20,
      attribution:"CARTO"
    });

    state.map2d.on("move zoom zoomend moveend resize", updateHUD);
    setBase2D($("baseSelect").value);
    requestAnimationFrame(() => state.map2d.invalidateSize(true));
    setTimeout(() => state.map2d.invalidateSize(true), 150);
    log("2D initialized");
  }

  function setBase2D(key){
    if (!state.map2d) return;
    if (state.base2dLayer) {
      try { state.map2d.removeLayer(state.base2dLayer); } catch {}
    }
    state.base2dLayer = buildBaseLayer(key);
    state.base2dLayer.addTo(state.map2d);

    if ($("labelsChk").checked) {
      if (!state.map2d.hasLayer(state.labels2dLayer)) state.labels2dLayer.addTo(state.map2d);
    } else {
      if (state.map2d.hasLayer(state.labels2dLayer)) state.map2d.removeLayer(state.labels2dLayer);
    }

    requestAnimationFrame(() => state.map2d.invalidateSize(true));
    updateHUD();
    log("2D base set: " + key);
  }

  function ensureViewer(){
    if (state.viewer3d) return;
    state.viewer3d = new Cesium.Viewer("map3d", {
      animation:false,
      timeline:false,
      geocoder:false,
      homeButton:false,
      sceneModePicker:false,
      baseLayerPicker:false,
      navigationHelpButton:false,
      infoBox:false,
      selectionIndicator:false,
      terrainProvider:new Cesium.EllipsoidTerrainProvider()
    });
    state.viewer3d.camera.moveEnd.addEventListener(updateHUD);
    setBase3D($("baseSelect").value);
    log("3D initialized");
  }

  function clear3DImagery(){
    if (!state.viewer3d) return;
    const layers = state.viewer3d.imageryLayers;
    while (layers.length > 0) layers.remove(layers.get(0), true);
    state.labels3dLayer = null;
  }

  function setBase3D(key){
    ensureViewer();
    clear3DImagery();

    let url = CONFIG.esri, subdomains = undefined, maxLevel = 19;
    if (key === "osm") { url = CONFIG.osm; subdomains = ["a","b","c"]; }
    else if (key === "hot") { url = CONFIG.hot; subdomains = ["a","b","c"]; }
    else if (key === "gibs_modis") { url = gibsBaseUrl("MODIS_Terra_CorrectedReflectance_TrueColor"); }
    else if (key === "gibs_viirs") { url = gibsBaseUrl("VIIRS_SNPP_CorrectedReflectance_TrueColor"); }

    state.viewer3d.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
      url, subdomains, maximumLevel:maxLevel
    }));

    if ($("labelsChk").checked) {
      state.labels3dLayer = state.viewer3d.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: CONFIG.labels,
          subdomains:["a","b","c","d"],
          maximumLevel:20
        })
      );
      state.labels3dLayer.alpha = 0.88;
    }

    state.viewer3d.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(CONFIG.home.lon, CONFIG.home.lat, CONFIG.home.height3d),
      duration: 0
    });

    state.viewer3d.resize();
    state.viewer3d.scene.requestRender();
    updateHUD();
    log("3D base set: " + key);
  }

  function ensureAstro(){
    if (state.astro.instance) return;

    state.astro.instance = A.aladin("#astroCanvas", {
      survey: state.astro.survey,
      target: state.astro.target,
      fov: state.astro.fov,
      cooFrame: "J2000",
      showReticle: state.astro.reticle,
      showZoomControl: false,
      showFullscreenControl: false,
      showLayersControl: false,
      showGotoControl: false,
      reticleColor: "#6cb8ff"
    });

    state.astro.routeCatalog = A.catalog({
      name:"Route nodes",
      color:"#22c55e",
      shape:"triangle",
      sourceSize:10,
      onClick:"showPopup"
    });

    state.astro.routeOverlay = A.graphicOverlay({
      color:"#38bdf8",
      lineWidth:3
    });

    state.astro.instance.addCatalog(state.astro.routeCatalog);
    state.astro.instance.addOverlay(state.astro.routeOverlay);

    log("Astro initialized");
  }

  function astroApply(){
    ensureAstro();
    state.astro.survey = $("astroSurvey").value;
    try { state.astro.instance.setImageSurvey(state.astro.survey); } catch {}
    try { state.astro.instance.showReticle(state.astro.reticle); } catch {}
    try { state.astro.instance.setFoV(state.astro.fov); } catch {}
    updateHUD();
  }

  function astroSearch(){
    ensureAstro();
    const q = $("astroSearchBox").value.trim();
    if (!q) return;
    state.astro.target = q;
    try { state.astro.instance.gotoObject(q); } catch {}
    log("Astro target: " + q);
    updateHUD();
  }

  function astroZoomIn(){
    ensureAstro();
    state.astro.fov = Math.max(0.01, state.astro.fov * 0.65);
    try { state.astro.instance.setFoV(state.astro.fov); } catch {}
    updateHUD();
  }

  function astroZoomOut(){
    ensureAstro();
    state.astro.fov = Math.min(180, state.astro.fov * 1.45);
    try { state.astro.instance.setFoV(state.astro.fov); } catch {}
    updateHUD();
  }

  function astroWide(){
    ensureAstro();
    state.astro.fov = 120;
    try { state.astro.instance.setFoV(state.astro.fov); } catch {}
    updateHUD();
  }

  function svc(item){
    const ra = item.ra * Math.PI / 180;
    const dec = item.dec * Math.PI / 180;
    const r = item.distanceLy || 0;
    return {
      x: r * Math.cos(dec) * Math.cos(ra),
      y: r * Math.cos(dec) * Math.sin(ra),
      z: r * Math.sin(dec)
    };
  }

  function distanceLy(a, b){
    const A = svc(a), B = svc(b);
    return Math.hypot(B.x - A.x, B.y - A.y, B.z - A.z);
  }

  function formatSpaceDistance(ly){
    const unit = $("spaceDistanceUnitSelect").value;
    if (unit === "au") return (ly * 63241.077).toFixed(3) + " AU";
    if (unit === "km") return (ly * 9.4607304725808e12).toExponential(3) + " km";
    return (ly >= 1000 ? ly.toLocaleString(undefined,{maximumFractionDigits:1}) : ly.toFixed(6)) + " ly";
  }

  function getSpaceItem(id){
    return SPACE_CATALOG.find(x => x.id === id) || null;
  }


  function projectRaDecToLatLon(ra, dec){
    const lon = ((((Number(ra) || 0) + 180) % 360) + 360) % 360 - 180;
    const lat = Math.max(-85, Math.min(85, Number(dec) || 0));
    return { lat, lon };
  }

  function clearEarthSpaceRoute(){
    if (state.astro.earthRoute2d && state.map2d) {
      try { state.map2d.removeLayer(state.astro.earthRoute2d); } catch {}
    }
    if (state.astro.earthRoute2dMarkers && state.map2d) {
      try { state.map2d.removeLayer(state.astro.earthRoute2dMarkers); } catch {}
    }
    if (state.astro.earthRoute3d && state.viewer3d) {
      try { state.viewer3d.dataSources.remove(state.astro.earthRoute3d, true); } catch {}
    }
    state.astro.earthRoute2d = null;
    state.astro.earthRoute2dMarkers = null;
    state.astro.earthRoute3d = null;
  }

  function drawEarthSpaceRoute(route){
    clearEarthSpaceRoute();
    if (!route || !route.waypoints || route.waypoints.length < 2) {
      log("Earth/3D projected route skipped: not enough waypoints");
      return;
    }

    const latlngs = route.waypoints.map(wp => {
      const p = projectRaDecToLatLon(wp.ra, wp.dec);
      return [p.lat, p.lon];
    });

    if (state.map2d && latlngs.length >= 2) {
      state.astro.earthRoute2d = L.polyline(latlngs, {
        pane: "overlay",
        color: "#7dd3fc",
        weight: 5,
        opacity: 0.95,
        dashArray: "10 8"
      }).addTo(state.map2d);

      const markers = latlngs.map((pt, i) => {
        const wp = route.waypoints[i];
        return L.circleMarker(pt, {
          pane: "overlay",
          radius: i === 0 ? 8 : 7,
          color: i === 0 ? "#22c55e" : "#eab308",
          fillColor: i === 0 ? "#22c55e" : "#eab308",
          fillOpacity: 0.98,
          weight: 2
        }).bindPopup(
          `<b>${wp.name}</b><br>RA ${fmt(wp.ra,4)}° • Dec ${fmt(wp.dec,4)}°<br>${formatSpaceDistance(wp.distanceLy)}`
        );
      });

      state.astro.earthRoute2dMarkers = L.layerGroup(markers).addTo(state.map2d);

      try {
        const bounds = L.latLngBounds(latlngs);
        if (bounds.isValid()) state.map2d.fitBounds(bounds.pad(0.2));
      } catch {}

      setTimeout(() => {
        try { state.map2d.invalidateSize(true); } catch {}
      }, 80);
    }

    if (state.viewer3d && latlngs.length >= 2) {
      const ds = new Cesium.CustomDataSource("earthSpaceRoute");
      const positions = latlngs.map((pt, i) =>
        Cesium.Cartesian3.fromDegrees(pt[1], pt[0], 300000 + i * 250000)
      );

      ds.entities.add({
        polyline: {
          positions,
          width: 5,
          material: Cesium.Color.DEEPSKYBLUE.withAlpha(0.98)
        }
      });

      latlngs.forEach((pt, i) => {
        ds.entities.add({
          position: Cesium.Cartesian3.fromDegrees(pt[1], pt[0], 300000 + i * 250000),
          point: {
            pixelSize: i === 0 ? 11 : 9,
            color: i === 0 ? Cesium.Color.LIME : Cesium.Color.YELLOW
          }
        });
      });

      state.viewer3d.dataSources.add(ds);
      state.astro.earthRoute3d = ds;

      try { state.viewer3d.flyTo(ds, { duration: 1.6 }); } catch {}
      try { state.viewer3d.scene.requestRender(); } catch {}
    }

    log(`Earth/3D projected route drawn with ${route.waypoints.length} waypoint(s)`);
}


  function clearSpaceRoute(){
    state.astro.waypoints = [];
    state.astro.route = null;

    if (typeof clearAstroRouteGraphics === "function") clearAstroRouteGraphics();
    if (typeof clearEarthSpaceRoute === "function") clearEarthSpaceRoute();

    if (typeof renderWaypointList === "function") renderWaypointList();
    if (typeof updateSpaceOutputs === "function") updateSpaceOutputs(null);

    log("Space route cleared");
}


  function buildSpaceRoute(){
    const start = typeof getSpaceItem === "function"
      ? getSpaceItem($("spaceStartSelect").value)
      : null;
    const end = typeof getSpaceItem === "function"
      ? getSpaceItem($("spaceEndSelect").value)
      : null;

    if (!start || !end) {
      log("Space route build failed: missing start or end node");
      return;
    }

    state.astro.waypoints = [
      JSON.parse(JSON.stringify(start)),
      JSON.parse(JSON.stringify(end))
    ];

    if (typeof buildRouteFromWaypoints === "function") {
      state.astro.route = buildRouteFromWaypoints(state.astro.waypoints);
    } else {
      state.astro.route = { waypoints: state.astro.waypoints, legs: [], totalLy: 0 };
    }

    try { ensureAstro(); } catch (e) { log(`ensureAstro failed: ${e.message}`); }
    try { drawAstroRoute(state.astro.route); } catch (e) { log(`drawAstroRoute failed: ${e.message}`); }
    try { drawEarthSpaceRoute(state.astro.route); } catch (e) { log(`drawEarthSpaceRoute failed: ${e.message}`); }
    try { renderWaypointList(); } catch {}
    try { updateSpaceOutputs(state.astro.route); } catch {}

    if (state.mode === "2d" && state.map2d) {
      setTimeout(() => { try { state.map2d.invalidateSize(true); } catch {} }, 100);
    }
    if (state.mode === "3d" && state.viewer3d) {
      setTimeout(() => {
        try { state.viewer3d.resize(); } catch {}
        try { state.viewer3d.scene.requestRender(); } catch {}
      }, 100);
    }

    log(`Space route built: ${start.name} -> ${end.name}`);
}



  function updateHUD(){
    const hud = $("hud");
    if (state.mode === "2d" && state.map2d) {
      const c = state.map2d.getCenter();
      hud.textContent =
        `Mode: 2D\nBase: ${$("baseSelect").value}\nZoom: ${state.map2d.getZoom()}\nlat ${fmt(c.lat)} lon ${fmt(c.lng)}`;
      return;
    }
    if (state.mode === "3d" && state.viewer3d) {
      const c = state.viewer3d.camera.positionCartographic;
      hud.textContent =
        `Mode: 3D\nBase: ${$("baseSelect").value}\nHeight: ${Math.round(c.height)} m\nlat ${fmt(Cesium.Math.toDegrees(c.latitude))} lon ${fmt(Cesium.Math.toDegrees(c.longitude))}`;
      return;
    }
    hud.textContent =
      `Mode: ASTRO\nSurvey: ${state.astro.survey}\nTarget: ${state.astro.target}\nFoV: ${fmt(state.astro.fov,2)}°`;
  }

  function showMode(mode){
    state.mode = mode;
    $("mode2d").classList.toggle("active", mode === "2d");
    $("mode3d").classList.toggle("active", mode === "3d");
    $("modeAstro").classList.toggle("active", mode === "astro");
    updateModeBadge();

    $("map2d").style.display = mode === "2d" ? "block" : "none";
    $("map3d").style.display = mode === "3d" ? "block" : "none";
    $("astroWrap").style.display = mode === "astro" ? "block" : "none";

    if (mode === "2d" && state.map2d) {
      setTimeout(() => {
        try { state.map2d.invalidateSize(true); } catch {}
        if (state.astro.route) {
          try { drawEarthSpaceRoute(state.astro.route); } catch {}
        }
      }, 80);
    }

    if (mode === "3d") {
      ensureViewer();
      setTimeout(() => {
        try { state.viewer3d.resize(); } catch {}
        try { state.viewer3d.scene.requestRender(); } catch {}
        if (state.astro.route) {
          try { drawEarthSpaceRoute(state.astro.route); } catch {}
        }
      }, 100);
    }

    if (mode === "astro") {
      ensureAstro();
      setTimeout(() => {
        try { astroApply(); } catch {}
        if (state.astro.route) {
          try { drawAstroRoute(state.astro.route); } catch {}
        }
      }, 60);
    }

    updateHUD();
    if (isMobile()) setPanelHidden(true);
}


  async function smartSearch(){
    const q = $("searchBox").value.trim();
    if (!q) return;

    const m = q.match(/^\\s*(-?\\d+(\\.\\d+)?)\\s*,\\s*(-?\\d+(\\.\\d+)?)\\s*$/);
    if (m) {
      const lat = Number(m[1]), lon = Number(m[3]);
      if (state.map2d) state.map2d.setView([lat, lon], Math.max(8, state.map2d.getZoom()));
      if (state.viewer3d) {
        state.viewer3d.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1800000),
          duration:1
        });
      }
      log(`Jump: ${lat}, ${lon}`);
      return;
    }

    try {
      const r = await fetch(CONFIG.nominatim + encodeURIComponent(q), { cache:"no-store" });
      const j = await r.json();
      if (Array.isArray(j) && j.length) {
        const lat = Number(j[0].lat), lon = Number(j[0].lon);
        showMode("2d");
        state.map2d.setView([lat, lon], 10);
        log(`Search Earth: ${q}`);
        return;
      }
    } catch {}

    showMode("astro");
    $("astroSearchBox").value = q;
    astroSearch();
  }

  function goHome(){
    if (state.mode === "2d" && state.map2d) {
      state.map2d.setView([CONFIG.home.lat, CONFIG.home.lon], CONFIG.home.zoom2d);
      return;
    }
    if (state.mode === "3d") {
      ensureViewer();
      state.viewer3d.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(CONFIG.home.lon, CONFIG.home.lat, CONFIG.home.height3d),
        duration:1
      });
      return;
    }
    if (state.mode === "astro") {
      $("astroSearchBox").value = "M31";
      astroSearch();
    }
  }

  function fillSpaceSelectors(){
    const html = SPACE_CATALOG.map(item => `<option value="${item.id}">${item.name}</option>`).join("");
    $("spaceStartSelect").innerHTML = html;
    $("spaceEndSelect").innerHTML = html;
    $("spaceStartSelect").value = "earth";
    $("spaceEndSelect").value = "m31";
  }

  function wireMobileMenu(){
    const panel = $("panel");
    const toggle = $("menuToggle");
    const backdrop = $("panelBackdrop");

    function sync(){
      const mobile = window.matchMedia("(max-width:980px)").matches;
      if (!mobile) {
        panel.classList.remove("panel-hidden");
        backdrop.classList.remove("show");
        return;
      }
      backdrop.classList.toggle("show", !panel.classList.contains("panel-hidden"));
    }

    toggle.onclick = () => {
      panel.classList.toggle("panel-hidden");
      sync();
    };
    backdrop.onclick = () => {
      panel.classList.add("panel-hidden");
      sync();
    };
    window.addEventListener("resize", sync);

    if (window.matchMedia("(max-width:980px)").matches) {
      panel.classList.add("panel-hidden");
    }
    sync();
  }

  function perfTick(){
    $("perf").textContent = "mode: " + state.mode.toUpperCase();
    requestAnimationFrame(perfTick);
  }

  function boot(){
    $("gibsDate").value = yesterdayUTC();

    fillSpaceSelectors();
    wireMobileMenu();

    $("mode2d").onclick = () => showMode("2d");
    $("mode3d").onclick = () => showMode("3d");
    $("modeAstro").onclick = () => showMode("astro");

    $("baseSelect").onchange = () => {
      if (state.map2d) setBase2D($("baseSelect").value);
      if (state.viewer3d) setBase3D($("baseSelect").value);
    };
    $("labelsChk").onchange = () => {
      if (state.map2d) setBase2D($("baseSelect").value);
      if (state.viewer3d) setBase3D($("baseSelect").value);
    };
    $("gibsDate").onchange = () => {
      if (state.map2d) setBase2D($("baseSelect").value);
      if (state.viewer3d) setBase3D($("baseSelect").value);
    };

    $("searchBtn").onclick = () => smartSearch();
    $("searchBox").addEventListener("keydown", e => {
      if (e.key === "Enter") smartSearch();
    });
    $("homeBtn").onclick = goHome;

    $("astroSurvey").onchange = astroApply;
    $("astroSearchBtn").onclick = astroSearch;
    $("astroResetBtn").onclick = () => { $("astroSearchBox").value = "M31"; astroSearch(); };
    $("astroReticleBtn").onclick = () => {
      state.astro.reticle = !state.astro.reticle;
      astroApply();
    };
    $("astroZoomInBtn").onclick = astroZoomIn;
    $("astroZoomOutBtn").onclick = astroZoomOut;
    $("astroFitBtn").onclick = astroWide;
    $("astroHudPlus").onclick = astroZoomIn;
    $("astroHudMinus").onclick = astroZoomOut;
    $("astroHudWide").onclick = astroWide;

    $("spaceBuildBtn").onclick = () => { try { buildSpaceRoute(); } catch (e) { log(`Space route failed: ${e.message}`); } };
    $("spaceClearBtn").onclick = clearSpaceRoute;
    $("spaceCenterEarthBtn").onclick = () => {
      $("spaceStartSelect").value = "earth";
      showMode("astro");
    };
    $("spaceDistanceUnitSelect").onchange = () => {
      const a = getSpaceItem($("spaceStartSelect").value);
      const b = getSpaceItem($("spaceEndSelect").value);
      if (a && b && $("spaceLegCountOut").textContent !== "—") buildSpaceRoute();
    };

    init2D();
    showMode("2d");
    perfTick();
    setStatus("Ready", "ok");
    log("Ready ✅");
  }

  boot();
})();
</script>
</body>
