<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Leaflet -->

  <style>
    :root { color-scheme: dark; }
    html, body { height:100%; margin:0; background:#0b0c10; color:#e9eef5; font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; }
    #app { height:100%; display:grid; grid-template-columns: 380px 1fr; }
    #panel{
      padding:12px;
      border-right:1px solid rgba(255,255,255,.08);
      background: rgba(12,14,18,.95);
      overflow:auto;
    }
    #viewWrap{ position:relative; min-width:0; }
    #map, #cesiumContainer{ position:absolute; inset:0; }
    #map{ display:block; }
    #cesiumContainer{ display:none; }

    h1{ font-size:14px; margin:0 0 8px; font-weight:700; letter-spacing:.2px; }
    .sub{ font-size:12px; opacity:.8; margin:0 0 10px; }
    .box{ border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:10px; margin:10px 0; background: rgba(15,18,24,.65); }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .row > *{ flex:0 0 auto; }
    label{ font-size:12px; opacity:.85; }
    input, select, button, textarea{
      background:#0f141c; color:#e9eef5;
      border:1px solid rgba(255,255,255,.14);
      border-radius:10px;
      padding:8px 10px;
      outline:none;
    }
    input[type="text"], textarea, select{ width:100%; }
    button{ cursor:pointer; }
    button.primary{ background:#1b2a46; border-color: rgba(120,170,255,.45); }
    button.warn{ background:#3a1f1f; border-color: rgba(255,120,120,.45); }
    .tiny{ font-size:12px; opacity:.85; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; font-size:12px; }
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      font-size:12px;
    }
    .toggle{ display:flex; gap:8px; }
    .toggle button{ flex:1 1 auto; }
    .hr{ height:1px; background: rgba(255,255,255,.10); margin:10px 0; }
    .muted{ opacity:.7; }
    .smallbtn{ padding:6px 8px; border-radius:9px; font-size:12px; }
    .grid3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
    .slider{ width:100%; }
    .stickyTop{ position:sticky; top:0; z-index:5; padding-bottom:10px; background: rgba(12,14,18,.95); }
    .kbd{ font-family: ui-monospace, Menlo, monospace; border:1px solid rgba(255,255,255,.18); border-bottom-width:2px; border-radius:6px; padding:1px 6px; }
    .list{ margin:0; padding-left:16px; }
    .list li{ margin:4px 0; }

    /* Leaflet controls visibility */
    .leaflet-control-zoom a { background: rgba(15,18,24,.9) !important; color:#e9eef5 !important; border-color: rgba(255,255,255,.15) !important; }
    .leaflet-control-attribution { background: rgba(12,14,18,.75) !important; color:#cbd5e1 !important; }

    /* Small HUD (top-right) */
    #hud {
      position:absolute; right:10px; top:10px;
      background: rgba(12,14,18,.55);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events:none;
      white-space: pre;
    }
  </style>
</head>
